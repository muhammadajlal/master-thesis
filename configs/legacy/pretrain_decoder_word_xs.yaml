# Text-only pretraining for AR decoder (ar_transformer_xs, baseline xs).
# Companion to pretrain_decoder_word.yaml (which uses ar_transformer_s).
# Used to produce the baseline xs AR-LM needed by the §5.15 decoding-study
# Stage D cross-check.
#
# Run via SLURM:
#   sbatch --export=ALL,PRETRAIN_YAML=pretrain_decoder_word_xs.yaml \
#          slurm/train_pretrain.sbatch

idx_fold: 0
dir_work: /home/woody/iwso/iwso214h/imu-hwr/results/hwr2/pretrain_ar_decoder_word_xs

test: false
epoch: 100
max_train_iters: null

freq_log: 200
freq_eval: 1
freq_save: 1

wordlist_path: assets/dictionaries/mixed_en_de_no_onhw.txt
val_ratio: 0.01
max_words: null

tokenizer:
  type: categories
  categories_from_yaml: configs/train_element_word.yaml
  categories_key: categories

unknown_policy: drop

# === ONLY DIFFERENCE FROM SCALED CONFIG: arch_de ===
arch_de: ar_transformer_xs
use_gated_attention: true
gating_type: elementwise

batch_size: 512
lr: 0.0005
weight_decay: 0.01
clip_grad: 1.0
use_cosine: true

max_len: 32
max_decode_len: 32

eval_max_samples: null
eval_batch_words: 512

device: cuda
num_workers: 16
seed: 1337
