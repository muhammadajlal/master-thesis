# Dual-head configuration for hybrid CTC/Attention model
dual_head:
  enabled: false
  arch_ctc: linear
  lambda_ar: 1.0
  lambda_ctc: 0.5  # base value (will be overridden by schedule if enabled)
  tie:
    ctc_to_ar_outproj: false  # tie CTC outproj to AR outproj
    ar_emb_outproj: false    # tie AR embedding outproj to AR outproj
    ctc_input_space: "dec"  # "enc" or "dec" (dec reuses mem_proj if dims mismatch)
  lambda_ctc_schedule:
    enabled: false         # enable/disable schedule (if false, uses static lambda_ctc)
    type: linear          # schedule type (linear ramp/decay over epochs), not CTC head architecture
    warmup_epochs: 0      # no warmup, start at max immediately
    max: 0.6              # high CTC early
    decay_start: 50       # start decay at epoch 50
    min: 0.1              # decay to low by epoch 150
    decay_epochs: 100     # decay over 100 epochs (50→150)
  loss_balance: sum       # "sum" (default): loss = λ_ar·loss_ar + λ_ctc·loss_ctc (current behavior, no change)
                          # "normalize": loss = (λ_ar·loss_ar + λ_ctc·loss_ctc) / (λ_ar + λ_ctc) (keeps gradients stable across λ sweeps)
                          # "convex": loss = (1-α)·loss_ar + α·loss_ctc where α = clamp(λ_ctc, 0, 1)

# AR-only + decoder-side CTC (pooling mode)
decoder_side_ctc:
  enabled: true
  mode: pool        # 'attention' or 'pool' (pooling mode uses encoder-decoder attention weights to pool encoder outputs)
  layers: [1, 2, 3]
  lambda: 0.3
  
# Model architecture and training settings
arch_de: 'ar_transformer_s' # decoder architecture
freeze_decoder_epochs: 0 # Ablation: freeze AR decoder for first N epochs (0 = train end-to-end from start)
pretrained_decoder_checkpoint: null # path to pretrained AR decoder checkpoint to load
arch_en: 'blconv_b'
aug: true # whether to perform data augmentation for train set
cache: true # whether to cache the whole dataset into rams
checkpoint: null # path to checkpoint to load
ctc_decoder: best_path
device: cuda

dir_dataset: /home/woody/iwso/iwso214h/imu-hwr/data/onhw_wi_word_rh
dir_work: /home/woody/iwso/iwso214h/imu-hwr/results/hwr2/train_element_word_AR-only_decoder-side-CTC_03_pool

epoch: 300
# We also can set epoch_warmup to 10 for more quick debugging.
epoch_warmup: 30
freeze: false # whether to freeze the encoder
freq_eval: 5 # frequency (epoch) to evaulate model performance on val set
freq_log: 50 # frequency (iteration) to log information
freq_save: 5 # frequency (epoch) to save model checkpoint
save_best_only: true # whether to save only the best checkpoints during training
export_val_full: false # whether to export full val set decoding results during training
idx_fold: 0 # cross validation fold index. 0 for non-cross validation. -1 for train for all cross-validation folds automatically
len_seq: 0
lr: 0.001
num_channel: 13
num_worker: 16
seed: 42
size_batch: 64
test: false
use_amp: true # whether to use automatic mixed precision (AMP) training, default true


tokenizer:
  type: sentencepiece
  model: /home/woody/iwso/iwso214h/imu-hwr/work/REWI_work/tokenizer/bpe100.model
  vocab_size: 100
use_bpe: false
# Only for transformer decoder
use_gated_attention: true
gating_type: elementwise # options: "elementwise", "headwise"

