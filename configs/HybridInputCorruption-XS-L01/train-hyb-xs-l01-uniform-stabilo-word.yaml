dual_head:
  enabled: true
  arch_ctc: linear
  lambda_ar: 1.0
  lambda_ctc: 0.1
  tie:
    ctc_to_ar_outproj: false
    ar_emb_outproj: false
    ctc_input_space: dec
  lambda_ctc_schedule:
    enabled: false
    type: linear
    warmup_epochs: 0
    max: 0.1
    decay_start: 50
    min: 0.1
    decay_epochs: 100
  loss_balance: sum
arch_de: ar_transformer_xs
freeze_decoder_epochs: 0
pretrained_decoder_checkpoint: null
arch_en: blconv_b
