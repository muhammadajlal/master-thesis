# HWRFormer-AR (ungated) on private sentences.
# Uses the full sentence-level char set (letters + digits + punctuation + space).

arch_de: 'ar_transformer_xs'
freeze_decoder_epochs: 0
pretrained_decoder_checkpoint: null

arch_en: 'blconv_b'
aug: true
cache: true
checkpoint: null
ctc_decoder: best_path
device: cuda

dir_dataset: /home/woody/iwso/iwso214h/imu-hwr/data/wi_sent_hw6_meta
dir_work: /home/woody/iwso/iwso214h/imu-hwr/results/hwr2/Baseline-AR-XS-Ungated/ar_transformer_xs__wi_sent_hw6_meta

epoch: 300
epoch_warmup: 30
freeze: false
freq_eval: 5
freq_log: 50
freq_save: 10
save_best_only: true
export_val_full: false
idx_fold: 0
len_seq: 0
lr: 0.001
num_channel: 13
num_worker: 16
seed: 42
size_batch: 64
test: false

tokenizer:
  type: sentencepiece
  model: /home/woody/iwso/iwso214h/imu-hwr/work/REWI_work/tokenizer/bpe100.model
  vocab_size: 100
use_bpe: false

use_gated_attention: false
gating_type: elementwise

