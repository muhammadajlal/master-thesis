[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewi"
version = "1.0.0"
description = "IMU handwriting recognition: HWRFormer (AR Transformer, noise injection, hybrid CTC-AR) and HWR-GPT (connector + LoRA GPT-2)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [{ name = "Muhammad Ajlal" }]
dependencies = [
  "einops",
  "huggingface_hub",
  "jiwer",
  "Levenshtein",
  "loguru",
  "matplotlib",
  "numpy",
  "PyYAML",
  "scipy",
  "thop",
  "timm",
  "torch",
  "transformers",
]

[project.optional-dependencies]
lora = ["peft"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rewi*"]
